[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xai-tts-tui"
version = "0.2.0"
description = "A Textual TUI for xAI TTS Studio"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.40.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "pygame>=2.5.2"
]

[project.scripts]
xai-tts = "xai_tts.app:main"
